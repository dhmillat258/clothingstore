<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details - ClothingStore</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <div class="logo">ClothingStore</div>

    <nav>
        <a href="/">Home</a>
        <a href="/products">All Products</a>
        <a href="/cart">Cart</a>
        <a href="/order-history">My Orders</a>
        <a href="/logout">Logout</a>
    </nav>

</header>

<main>

    <section class="admin-orders">

        <h1>
            Order #<span th:text="${order.id}"></span>
        </h1>

        <div class="order-card">

            <p>
                <strong>Date:</strong>
                <span th:text="${order.orderDate}"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span th:text="${order.status}"></span>
            </p>

            <p>
                <strong>Payment:</strong>
                <span th:text="${order.paymentMethod}"></span>
            </p>

            <p>
                <strong>Delivery Address:</strong>
                <span th:text="${order.address}"></span>
            </p>

        </div>

        <h2>Products</h2>

        <div class="order-item-row">

            <img th:src="${item.image}"
                 th:alt="${item.productName}"
                 class="order-item-image">

            <div class="order-item-info">

                <div>

                    <h3 th:text="${item.productName}">
                        Product
                    </h3>

                    <p>
                        Price:
                        ৳<span th:text="${item.price}"></span>
                    </p>

                    <p>
                        Quantity:
                        <span th:text="${item.quantity}"></span>
                    </p>

                    <p>
                        Subtotal:
                        ৳<span
                            th:text="${item.price * item.quantity}">
                        </span>
                    </p>

                </div>

            </div>

        </div>

        <h2>
            Total:
            ৳<span th:text="${order.total}"></span>
        </h2>

        <a href="/order-history">
            ← Back to My Orders
        </a>

    </section>

</main>

</body>
</html>
