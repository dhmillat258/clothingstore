<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header>

    <div class="logo">
        ClothingStore Admin
    </div>

    <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/products">Products</a>
        <a href="/admin/orders">Orders</a>
        <a href="/admin/logout">Logout</a>
    </nav>

</header>

<main>

    <section class="admin-dashboard">

        <h1>Admin Dashboard</h1>

        <div class="admin-cards">

            <div class="admin-card">

                <h2>Total Products</h2>

                <p th:text="${productCount}">
                    0
                </p>

            </div>

            <div class="admin-card">

                <h2>Total Orders</h2>

                <p th:text="${orderCount}">
                    0
                </p>

            </div>

            <div class="admin-card">

                <h2>Low Stock</h2>

                <p th:text="${lowStockCount}">
                    0
                </p>

            </div>

            <div class="admin-card">

                <h2>Total Sales</h2>

                <p>
                    ৳<span th:text="${#numbers.formatDecimal(totalSales, 0, 0)}">
                    0
                </span>
                </p>

            </div>

        </div>

        <div class="admin-actions">

            <a href="/admin/products">
                Manage Products
            </a>

            <a href="/admin/products/add">
                Add Product
            </a>

            <a href="/admin/orders">
                Manage Orders
            </a>

        </div>

    </section>

</main>

</body>
</html>
