<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact - ClothingStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <div class="logo">
        ClothingStore
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="#">Men</a>
        <a href="#">Women</a>
        <a href="#">Kids</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<main>

    <section class="contact-section">

        <h1>Contact Us</h1>

        <p>
            Have a question? Send us a message.
        </p>


        <form class="contact-form">

            <input type="text"
                   placeholder="Your Name"
                   required>

            <input type="email"
                   placeholder="Your Email"
                   required>

            <input type="text"
                   placeholder="Subject"
                   required>

            <textarea
                    placeholder="Your Message"
                    required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

</main>

</body>
</html>
