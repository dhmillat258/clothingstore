<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - ClothingStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <div class="logo">ClothingStore</div>

    <nav>
        <a href="/">Home</a>
        <a href="/men">Men</a>
        <a href="/women">Women</a>
        <a href="/kids">Kids</a>
        <a href="/products">All Products</a>
        <a href="/cart">Cart</a>
        <a href="/contact">Contact</a>

        <span th:if="${session.customerId == null}">
            <a href="/login">Login</a>
            <a href="/signup">Sign Up</a>
        </span>

        <span th:if="${session.customerId != null}">
            <a href="/order-history">My Orders</a>
            <a href="/logout">Logout</a>
        </span>
    </nav>
</header>

<main>

    <section class="products-section">

        <h1>
            Search Results for:
            <span th:text="${search}"></span>
        </h1>

        <div th:if="${products.isEmpty()}">
            <h3>No products found.</h3>
            <a href="/products">View All Products</a>
        </div>

        <div class="product-grid" th:if="${!products.isEmpty()}">

            <div class="product-card"
                 th:each="product : ${products}">

                <img th:src="${product.image}"
                     th:alt="${product.name}">

                <h3 th:text="${product.name}">
                    Product Name
                </h3>

                <p>
                    Color:
                    <span th:text="${product.color}"></span>
                </p>

                <p>
                    ৳<span th:text="${product.price}"></span>
                </p>

                <a th:href="@{/product-details(product=${product.id})}">
                    View Details
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
