<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Women - ClothingStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>

    <div class="logo">
        ClothingStore
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/men">Men</a>
        <a href="/women">Women</a>
        <a href="/kids">Kids</a>
        <a href="/cart">Cart</a>
        <a href="/contact">Contact</a>
    </nav>

</header>

<main>

    <section class="category-section">

        <h1>Women's Collection</h1>

        <p>Explore our latest women's clothing collection.</p>

        <div class="product-grid">


            <!-- Women's Top -->

            <div class="product-card">

                <div class="product-image">

                    <img src="/images/women-top.jpg"
                         alt="Women's Top">

                </div>

                <h3>Women's Top</h3>

                <p>Women's Wear</p>

                <p>Price available soon</p>

                <a href="/product-details?product=6">
                    <button>View Product</button>
                </a>

            </div>


            <!-- Sharee -->

            <div class="product-card">

                <div class="product-image">

                    <img src="/images/women-Sharee.jpg"
                         alt="Women's Sharee">

                </div>

                <h3>Women's Sharee</h3>

                <p>Sharee</p>

                <p>Price available soon</p>

                <a href="/product-details?product=7">
                    <button>View Product</button>
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
