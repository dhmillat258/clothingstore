<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ClothingStore</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

    <div class="logo">ClothingStore</div>

    <nav>

        <a href="/">Home</a>
        <a href="/men">Men</a>
        <a href="/women">Women</a>
        <a href="/kids">Kids</a>
        <a href="/products">All Products</a>
        <a href="/cart">Cart</a>
        <a href="/contact">Contact</a>
        <a href="/signup">Sign Up</a>

    </nav>

</header>


<main>

    <section class="admin-form">

        <h1>Login</h1>


        <p th:if="${error}"
           th:text="${error}"
           style="color:red;">
        </p>


        <form action="/login" method="post">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Enter your password"
                   minlength="6"
                   required>


            <button type="submit">
                Login
            </button>

        </form>


        <p>

            Don't have an account?

            <a href="/signup">
                Create Account
            </a>

        </p>

    </section>

</main>

</body>

</html>
