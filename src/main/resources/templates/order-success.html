<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Order Successful - ClothingStore</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header>

    <div class="logo">
        ClothingStore
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/men">Men</a>
        <a href="/women">Women</a>
        <a href="/kids">Kids</a>
        <a href="/products">All Products</a>
        <a href="/cart">Cart</a>
    </nav>

</header>

<main>

    <section class="admin-form">

        <h1>Order Placed Successfully!</h1>

        <p>
            Thank you for your order.
        </p>

        <p>
            <strong>Order Number:</strong>
            <span th:text="${order.id}">1</span>
        </p>

        <p>
            <strong>Status:</strong>
            <span th:text="${order.status}">
            Pending
        </span>
        </p>

        <p>
            <strong>Total:</strong>
            ৳<span th:text="${#numbers.formatDecimal(order.total, 0, 0)}">
            0
        </span>
        </p>

        <div style="margin-top:25px;">

            <a href="/">
                <button>Continue Shopping</button>
            </a>

            <a href="/order-history"
               th:if="${session.customerId != null}">
                <button>View My Orders</button>
            </a>

        </div>

    </section>

</main>

</body>
</html>
